apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - externalsecret-hermes-wildcard-tls.yaml
  - externalsecret-argocd-git-creds.yaml
#  - ingress-nginx.yaml
#  - metallb/

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 8.0.0
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
