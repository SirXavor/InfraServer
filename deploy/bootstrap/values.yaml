server:
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostname: "argocd.hermes.ranabo.com"
    path: /
    pathType: Prefix
    tls: false
    extraTls:
      - hosts:
          - argocd.hermes.ranabo.com
        secretName: hermes-wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      external-dns.alpha.kubernetes.io/hostname: argocd.hermes.ranabo.com
      external-dns.alpha.kubernetes.io/target: hermes.ranabo.com
