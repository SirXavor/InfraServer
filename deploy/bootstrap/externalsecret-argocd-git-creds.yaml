apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: argocd-repo-creds-github
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: "git"
        url: "https://github.com/SirXavor"
        username: "{{ .GIT_USER_NAME }}"
        password: "{{ .GIT_TOKEN }}"
  data:
    - secretKey: GIT_USER_NAME
      remoteRef:
        key: app/infrawriter/git
        property: GIT_USER_NAME
    - secretKey: GIT_TOKEN
      remoteRef:
        key: app/infrawriter/git
        property: GIT_TOKEN
